<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wykres Świecowy Giełdowy</title>

    <!-- 1. Ładowanie wymaganych bibliotek -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4/build/global/luxon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1/dist/chartjs-adapter-luxon.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial@0.2.0/dist/chartjs-chart-financial.min.js"></script>

    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .chart-box {
            width: 90%;
            max-width: 800px;
            background-color: #242424;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>

    <div class="chart-box">
        <h2>Wykres Świecowy (Giełda)</h2>
        <!-- Tutaj rysuje się wykres -->
        <canvas id="chartCanvas"></canvas>
    </div>

    <script>
        // Czekamy, aż cała strona się wczyta
        document.addEventListener('DOMContentLoaded', function () {
            const ctx = document.getElementById('chartCanvas').getContext('2d');

            // Dane w formacie giełdowym: o (open), h (high), l (low), c (close)
            const candleData = [
                { x: new Date('2026-03-01').getTime(), o: 100, h: 108, l: 98,  c: 105 },
                { x: new Date('2026-03-02').getTime(), o: 105, h: 107, l: 99,  c: 101 },
                { x: new Date('2026-03-03').getTime(), o: 101, h: 103, l: 90,  c: 92  },
                // Przykład świecy "Młotek" (bardzo niski punkt L, ale zamknięcie wysoko C)
                { x: new Date('2026-03-04').getTime(), o: 92,  h: 96,  l: 80,  c: 95  }, 
                { x: new Date('2026-03-05').getTime(), o: 95,  h: 106, l: 94,  c: 104 },
                { x: new Date('2026-03-06').getTime(), o: 104, h: 112, l: 102, c: 110 }
            ];

            new Chart(ctx, {
                type: 'candlestick',
                data: {
                    datasets: [{
                        label: 'Notowania (PLN)',
                        data: candleData,
                        color: {
                            up: '#26a69a',     // Zielony (wzrost)
                            down: '#ef5350',   // Czerwony (spadek)
                            unchanged: '#888888'
                        }
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        x: {
                            type: 'time',
                            time: {
                                unit: 'day'
                            },
                            ticks: { color: '#aaaaaa' },
                            grid: { color: '#333333' }
                        },
                        y: {
                            ticks: { color: '#aaaaaa' },
                            grid: { color: '#333333' }
                        }
                    }
                }
            });
        });
    </script>
</body>
</html>
