<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="stylesheet" href="css/style.css">

    <!-- Biblioteki Chart.js (do wykresów) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4/build/global/luxon.min.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1/dist/chartjs-adapter-luxon.umd.min.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial@0.2.0/dist/chartjs-chart-financial.min.js"></script>

    <script src="js/main_script.js"></script>
    <script src="js/gielda.js"></script>
    <title>Janusz_Biznesu</title>
</head>

<body>
    <section id="glowny_widok">
        <div class="grid-container">
            <!-- uzytkownik -->
            <div class="grid-item uzytkownik">
                <img src="/obrazy/pracownicy/w-man-brown.svg" alt="uzytkownik_pp">
                <div class="uzytkownik-info">
                    <div class="uzytkowwnik-nazwa">Janusz Karaś</div>
                    <div class="uzytkowwnik-poziom">Poziom: 67</div>
                </div>
                <button id="ustawienia">⚙️</button>
            </div>

            <div class="grid-item balans">
                <div class="stan-konta">
                    <span class="stan-etykieta">Stan konta:</span>
                    <span class="stan-status pozytywny">12.4%</span>
                </div>
                <div class="balans-wartosc">
                    125 450 <span class="waluta">PLN</span>
                </div>
            </div>
            <!-- ksiegowy -->
            <div class="grid-item ksiegowy">KSIĘGOWY</div>
            <!-- lista pracownikow -->
            <div class="grid-item pracownicy">
                <div class="pracownik">
                    <img src="/obrazy/pracownicy/b-woman-ginger.svg" alt="pracownik_pp">
                    <div class="info">
                        <div class="nazwa">Amanda Ryc</div>
                        <div class="poziom">Poziom: 2</div>
                    </div>
                    <button class="ustawienia">⚙️</button>
                </div>
            </div>

            <!-- gielda -->
            <div class="grid-item gielda">
                <div class="gielda-header">
                    <span class="gielda-label">Giełda:</span>
                    <div class="gielda-tabs-wrapper">
                        <div class="gielda-tabs">
                            <button class="btn-tab active" data-market="KRYPTO">Krypto</button>
                            <button class="btn-tab" data-market="GOLD">Złoto</button>
                            <button class="btn-tab" data-market="KGHM">Akcje</button>
                        </div>
                    </div>
                </div>

                <div class="market-control-panel">
                    <div class="market-info">
                        <span id="current-symbol" class="gielda-symbol">KRYPTO</span>
                        <div class="user-info">
                            Posiadasz: <span id="user-has">0</span> | Śr. cena: <span id="user-price">0.00</span> PLN
                        </div>
                    </div>
                    <div class="gielda-buttons">
                        <input type="number" id="trade-amount" value="1" min="1" class="trade-input">
                        <button class="btn-trade btn-kup" id="action-buy">KUP</button>
                        <button class="btn-trade btn-sprzedaj" id="action-sell">SPRZEDAJ</button>
                    </div>
                </div>

                <div class="gielda-chart-wrapper">
                    <canvas id="gieldaCanvas"></canvas>
                </div>
            </div>

            <!-- mieszkania -->
            <div class="grid-item mieszkania">MIESZKANIA</div>
            <!-- wydarzenia -->
            <div class="grid-item wydarzenia">WYDARZENIA</div>
            <!-- bank -->
            <div class="grid-item bank">BANK</div>
        </div>
    </section>
</body>

</html>
