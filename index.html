<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/mainScript.js" defer></script>
    <title>Janusz_Biznesu</title>
</head>

<body>
    <section id="main_screen">
        <div class="grid-container">
            <div class="grid-item uzytkownik" style="position: relative;">
                <img src="player_pp.png" alt="player_pp">
                <div class="user-info">
                    <div class="user-name">Janusz Karaś</div>
                    <div class="user-level">Lvl: 67</div>
                </div>
                <button id="settings">⚙️</button>
                <button name="setting" class="tile-button"></button>
            </div>
            <div class="grid-item balans">
                BALANS
                <button name="balance" class="tile-button"></button>
            </div>
            <div class="grid-item ksiegowy">
                KSIĘGOWY
                <button name="accountant" class="tile-button"></button>
            </div>
            <div class="grid-item lista-uzytkownikow">
                LISTA UŻYTKOWNIKÓW
                <button name="people" class="tile-button"></button>
            </div>

            <div class="grid-item gielda" style="position: relative;">
                GIEŁDA
                <button name="stock" class="tile-button"></button>
            </div>
            <div class="grid-item mieszkania">
                MIESZKANIA
                <button name="estate" class="tile-button"></button>
            </div>
            <div class="grid-item wydarzenia">
                WYDARZENIA
                <button name="events" class="tile-button"></button>
            </div>
            <div class="grid-item bank">
                BANK
                <button name="bank" class="tile-button"></button>
            </div>
        </div>

    </section>
    <div id="popup">
        <div class="generalInfo">
            <h2>Informacje</h2>
        </div>
        <div class="settingInfo">
            <h3>Ustawienia gry</h3>
            <p>Tutaj możesz zmienić opcje programu.</p>
        </div>
        <div class="stockInfo">
            <h3>Giełda papierów wartościowych</h3>
            <p>Giełda rośnie i maleje - działa</p>
        </div>
    </div>
</body>

</html>
