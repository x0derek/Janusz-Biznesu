<!DOCTYPE html>
<html lang="pl">

<head>
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="stylesheet" href="css/style.css">

    <script src="js/mainScript.js" defer></script>
    <script src="js/gielda.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4/build/global/luxon.min.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1/dist/chartjs-adapter-luxon.umd.min.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial@0.2.0/dist/chartjs-chart-financial.min.js"></script>

    <title>Janusz_Biznesu</title>
</head>

<body>
    <section id="main_screen">
        <div class="grid-container">
            <div class="grid-item uzytkownik" style="position: relative;">
                <img src="player_pp.png" alt="player_pp">
                <div class="user-info">
                    <div class="user-name">Janusz Karaś</div>
                    <div class="user-level">Lvl: 67</div>
                </div>
                <button id="settings">⚙️</button>
                <button name="setting" class="tile-button"></button>
            </div>

            <div class="grid-item balans">
                <button name="balance" class="tile-button"></button>
                <div class="stan-konta">
                    <span class="stan-label">Stan konta:</span>
                    <span id="stan-procent" class="stan-status positive">0.0%</span>
                </div>
                <div class="balans-value">
                    <span id="player-cash">100.00</span> <span class="waluta">PLN</span>
                </div>
            </div>

            <div class="grid-item ksiegowy">KSIĘGOWY<button name="accountant" class="tile-button"></button></div>
            <div class="grid-item lista-uzytkownikow">LISTA UŻYTKOWNIKÓW<button name="people"
                    class="tile-button"></button></div>

            <div class="grid-item gielda">
                <div class="gielda-header">
                    <span class="gielda-label">Giełda:</span>
                    <div class="gielda-tabs-wrapper">
                        <div class="gielda-tabs">
                            <button class="btn-tab active" data-market="KRYPTO">Krypto</button>
                            <button class="btn-tab" data-market="GOLD">Złoto</button>
                            <button class="btn-tab" data-market="KGHM">Akcje</button>
                        </div>
                    </div>
                </div>

                <div class="market-control-panel">
                    <div class="market-info">
                        <span id="current-symbol" class="gielda-symbol">KRYPTO</span>
                        <div class="user-info">
                            Posiadasz: <span id="user-has">0</span> | Śr. cena: <span id="user-price">0.00</span> PLN
                        </div>
                    </div>
                    <div class="gielda-buttons">
                        <input type="number" id="trade-amount" value="1" min="1" class="trade-input">
                        <button class="btn-trade btn-kup" id="action-buy">KUP</button>
                        <button class="btn-trade btn-sprzedaj" id="action-sell">SPRZEDAJ</button>
                    </div>
                </div>

                <div class="gielda-chart-wrapper">
                    <canvas id="gieldaCanvas"></canvas>
                </div>
            </div>

            <div class="grid-item mieszkania">MIESZKANIA<button name="estate" class="tile-button"></button></div>
            <div class="grid-item wydarzenia">WYDARZENIA<button name="events" class="tile-button"></button></div>
            <div class="grid-item bank">BANK<button name="bank" class="tile-button"></button></div>
        </div>
    </section>

    <div id="popup" style="display:none;">
        <div class="generalInfo">
            <h2>Informacje</h2>
        </div>
        <div class="settingInfo">
            <h3>Ustawienia gry</h3>
            <p>Tutaj możesz zmienić opcje programu.</p>
        </div>
        <div class="stockInfo">
            <div class="grid-item gielda">
                <div class="gielda-chart-wrapper">
                    <canvas id="gieldaCanvasPopup"></canvas>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
