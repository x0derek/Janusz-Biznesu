<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="stylesheet" href="style.css">
    
    <!-- Biblioteki Chart.js (do wykresów) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4/build/global/luxon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1/dist/chartjs-adapter-luxon.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial@0.2.0/dist/chartjs-chart-financial.min.js"></script>

    <script src="main_script.js"></script>
    <script src="gielda.js"></script>
    <title>Janusz_Biznesu</title>
</head>

<body>
    <section id="main_screen">
        <div class="grid-container">
            <!-- uzytkownik -->
            <div class="grid-item uzytkownik">
                <img src="player_pp.png" alt="player_pp">
                <div class="user-info">
                    <div class="user-name">Janusz Karaś</div>
                    <div class="user-level">Lvl: 67</div>
                </div>
                <button id="settings">⚙️</button>
            </div>
            <!-- balans -->
            <div class="grid-item balans">
                <div class="stan-konta">
                    <span class="stan-label">Stan konta:</span>
                    <span class="stan-status positive">12.4%</span>
                </div>
                <div class="balans-value">
                    125 450 <span class="waluta">PLN</span>
                </div>
            </div>
            <!-- ksiegowy -->
            <div class="grid-item ksiegowy">KSIĘGOWY</div>
            <!-- lista uzytkownikow -->
            <div class="grid-item lista-uzytkownikow">LISTA UŻYTKOWNIKÓW</div>
            
            <!-- gielda z czystym nagłówkiem i dyskretnymi przyciskami -->
            <div class="grid-item gielda">
                <div class="gielda-header">
                    <span class="gielda-label">Giełda:</span>
                    <div class="gielda-boxes">
                        <span class="gielda-symbol">GOLD</span>
                        <div class="gielda-buttons">
                            <button class="btn-trade btn-kup">KUP</button>
                            <button class="btn-trade btn-sprzedaj">SPRZEDAJ</button>
                        </div>
                    </div>
                </div>
                <div class="gielda-chart-wrapper">
                    <canvas id="gieldaCanvas"></canvas>
                </div>
            </div>

            <!-- mieszkania -->
            <div class="grid-item mieszkania">MIESZKANIA</div>
            <!-- wydarzenia -->
            <div class="grid-item wydarzenia">WYDARZENIA</div>
            <!-- bank -->
            <div class="grid-item bank">BANK</div>
        </div>
    </section>
</body>

</html>
